name: Build WLED stairs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WLED v16.0.1
        uses: actions/checkout@v4
        with:
          repository: wled/WLED
          ref: v16.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Add override with Animated Staircase usermod
        run: |
          cat > platformio_override.ini << 'EOF'
          [platformio]
          default_envs = gl_stairs

          [env:gl_stairs]
          extends = env:esp32dev
          custom_usermods = Animated_Staircase
          EOF

      - name: Build
        run: pio run -e gl_stairs

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/gl_stairs/*.bin
